<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found</title>
<script>
// GitHub Pages serves this page for any address that doesn't exist.
// Web addresses are case-sensitive, so "site-v20" (lowercase) misses the
// real "Site-v20" folder. If that's the only problem, forward to the
// right address, keeping the rest of it (page, ?lab=..., #section).
(function () {
  var p = location.pathname;
  var fixed = p.replace(/^\/ccna-syntax-checker\/site-v20(?=\/|$)/i, '/ccna-syntax-checker/Site-v20');
  if (fixed !== p) location.replace(fixed + location.search + location.hash);
})();
</script>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f4f6f8;color:#1a1a2e;margin:0;padding:48px 20px;text-align:center;line-height:1.6}
h1{font-size:1.4em;margin-bottom:8px}
p{color:#5a6a7a;max-width:480px;margin:8px auto}
a{color:#005073;font-weight:700}
</style>
</head>
<body>
<h1>Page not found</h1>
<p>That address doesn't exist. Addresses here are case-sensitive.</p>
<p><a href="/ccna-syntax-checker/Site-v20/">CCNA Study Hub (landing page)</a></p>
<p><a href="/ccna-syntax-checker/">CLI Engine</a></p>
</body>
</html>
